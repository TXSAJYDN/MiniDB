name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            build_type: Debug
            extra: ""
            asan: "0"
            ubsan: "0"
          - name: release
            build_type: Release
            extra: ""
            asan: "0"
            ubsan: "0"
          - name: asan
            build_type: Debug
            extra: "-DENABLE_ASAN=ON"
            asan: "1"
            ubsan: "0"
          - name: ubsan
            build_type: Debug
            extra: "-DENABLE_UBSAN=ON"
            asan: "0"
            ubsan: "1"
          - name: asan-ubsan
            build_type: Debug
            extra: "-DENABLE_ASAN=ON -DENABLE_UBSAN=ON"
            asan: "1"
            ubsan: "1"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled build tools
        run: |
          cmake --version
          g++ --version
          python3 --version
      - name: Configure
        run: |
          cmake -S . -B build/ci-${{ matrix.name }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.extra }}
      - name: Build
        run: cmake --build build/ci-${{ matrix.name }} -j2
      - name: Test
        env:
          ASAN_OPTIONS: ${{ matrix.asan == '1' && 'detect_leaks=1:abort_on_error=1:halt_on_error=1' || '' }}
          UBSAN_OPTIONS: ${{ matrix.ubsan == '1' && 'print_stacktrace=1:halt_on_error=1' || '' }}
        run: ctest --test-dir build/ci-${{ matrix.name }} --output-on-failure -j2

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled build tools
        run: |
          cmake --version
          g++ --version
          python3 --version
          setarch --version
      - name: Configure
        run: cmake -S . -B build/ci-tsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON
      - name: Build
        run: setarch x86_64 -R cmake --build build/ci-tsan -j2
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: setarch x86_64 -R ctest --test-dir build/ci-tsan --output-on-failure -j1

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled clang-format
        run: clang-format-18 --version
      - name: Check formatting
        run: |
          find src app tests fuzz experiments -type f \( -name '*.h' -o -name '*.cpp' \) \
            -print0 | xargs -0 clang-format-18 --dry-run --Werror

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled clang-tidy
        run: clang-tidy-18 --version
      - name: Configure compile database
        run: cmake -S . -B build/tidy -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        run: |
          find src app -type f -name '*.cpp' -print0 | \
            xargs -0 -n1 clang-tidy-18 -p build/tidy

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled clang
        run: clang++-18 --version
      - name: Configure fuzz targets
        run: |
          cmake -S . -B build/fuzz-ci \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_FUZZERS=ON
      - name: Build fuzz targets
        run: |
          cmake --build build/fuzz-ci -j2 --target \
            minidb_http_parser_fuzz \
            minidb_kv_protocol_fuzz \
            minidb_wal_record_fuzz \
            minidb_checkpoint_manifest_fuzz
      - name: Run fixed-seed corpus smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p /tmp/minidb-fuzz-http /tmp/minidb-fuzz-kv \
            /tmp/minidb-fuzz-wal /tmp/minidb-fuzz-manifest \
            /tmp/minidb-fuzz-artifacts
          cp fuzz/corpus/http/* /tmp/minidb-fuzz-http/
          cp fuzz/corpus/kv/* /tmp/minidb-fuzz-kv/
          cp fuzz/corpus/wal/* /tmp/minidb-fuzz-wal/
          cp fuzz/corpus/manifest/* /tmp/minidb-fuzz-manifest/
          build/fuzz-ci/fuzz/minidb_http_parser_fuzz \
            -seed=20261111 -runs=20000 -max_len=2097152 \
            -artifact_prefix=/tmp/minidb-fuzz-artifacts/ /tmp/minidb-fuzz-http
          build/fuzz-ci/fuzz/minidb_kv_protocol_fuzz \
            -seed=20261111 -runs=20000 -max_len=1179648 \
            -artifact_prefix=/tmp/minidb-fuzz-artifacts/ /tmp/minidb-fuzz-kv
          build/fuzz-ci/fuzz/minidb_wal_record_fuzz \
            -seed=20261111 -runs=20000 -max_len=1050000 \
            -artifact_prefix=/tmp/minidb-fuzz-artifacts/ /tmp/minidb-fuzz-wal
          build/fuzz-ci/fuzz/minidb_checkpoint_manifest_fuzz \
            -seed=20261111 -runs=20000 -max_len=2048 \
            -artifact_prefix=/tmp/minidb-fuzz-artifacts/ /tmp/minidb-fuzz-manifest
          test -z "$(find /tmp/minidb-fuzz-artifacts -type f -print -quit)"
